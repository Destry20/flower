<!DOCTYPE html>
<!-- lang/title/meta ниже — англоязычные по умолчанию (это же поведение задаёт
     detectLang() в main.js для любого браузера, чей язык не начинается с "ru").
     После загрузки JS сам переключает <html lang>, <title> и meta на русский
     для русскоязычных браузеров — см. bootstrap()/setLang() в public/script/main.js.
     Для ссылок на конкретную открытку (?data=...) сервер отдаёт свои, уже
     персонализированные meta по Accept-Language — см. server/index.js. -->
<html lang="en">
<head>
<!-- Google tag (gtag.js) — GA4-аккаунт владельца сайта, добавлен через
     analytics.google.com. googletagmanager.com/google-analytics.com
     разрешены отдельно в CSP (см. scriptSrc/connectSrc в server/index.js).
     Сам вызов gtag('config', ...) вынесен в свой файл (/script/gtag-init.js)
     вместо инлайн-<script>, чтобы не добавлять 'unsafe-inline' в scriptSrc —
     это ослабило бы CSP куда сильнее, чем один разрешённый внешний домен. -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-1HTLVYWDJF"></script>
<script src="/script/gtag-init.js"></script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VivoRose — a card with a virtual bouquet</title>
<meta name="description" content="A virtual bouquet that never wilts — pick the flowers, write your message, and share it with one link. Free, no sign-up, ready in minutes.">

<!-- Подтверждение сайта в Pinterest Business (Settings → Claim) — просто
     метка владения, ни на что на странице не влияет. -->
<meta name="p:domain_verify" content="c1400625df2e491c363fb45d99fed63a"/>

<!-- Всегда указывает на главную, а не на текущий URL — открытки по ссылкам
     (?data=..., /c/...) намеренно не претендуют на отдельное место в
     индексации, канонической страницей сайта остаётся только сама главная. -->
<link rel="canonical" href="https://vivorose.com/">

<!-- Structured data: помогает поисковику понять, что это за сайт (не
     подряд текста, а размеченный факт) — само по себе топ не гарантирует,
     но не будет хуже. -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "WebApplication",
  "name": "VivoRose",
  "url": "https://vivorose.com/",
  "description": "A virtual bouquet that never wilts — pick the flowers, write your message, and share it with one link. Free, no sign-up, ready in minutes.",
  "applicationCategory": "LifestyleApplication",
  "operatingSystem": "Any",
  "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" },
  "inLanguage": ["en", "ru"]
}
</script>

<!-- FAQPage: те же три вопроса/ответа, что в блоке "About the service" на
     странице (см. renderCreator() -> #about в public/script/main.js) — текст
     здесь должен совпадать с тем, что реально видно на странице, иначе
     Google просто проигнорирует разметку (или хуже — расценит как спам). -->
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "FAQPage",
  "mainEntity": [
    {
      "@type": "Question",
      "name": "Do I need to register?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "No — you can build and send a card without an account, the whole card fits inside the link itself. An account is only useful if you want your list of cards saved and available from any device."
      }
    },
    {
      "@type": "Question",
      "name": "Is it free?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Yes, completely. All flowers, vases, ribbons, envelopes and backgrounds are free — the service runs on ad banners, not paid subscriptions."
      }
    },
    {
      "@type": "Question",
      "name": "What occasions does it fit?",
      "acceptedAnswer": {
        "@type": "Answer",
        "text": "Birthdays, love confessions, thank-yous, congratulations, words of comfort or sympathy, or just a card \"because you thought of someone\" — each occasion gets its own set of flowers, ribbon color, and card tone."
      }
    }
  ]
}
</script>

<!-- Favicon: реальный PNG-файл первым (Google Search рекомендует именно
     файл, кратный 48px, для показа иконки в выдаче — inline data-URI как
     единственный источник он не всегда корректно подхватывает), SVG вторым
     для браузеров — те умеют выбрать более чёткий вариант сами. -->
<link rel="icon" type="image/png" sizes="48x48" href="/icon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="/icon-32.png">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Cpath d='M4 20C4 12 9 4 20 4C20 15 12 20 4 20Z' fill='%238CA087' stroke='%235C7457' stroke-width='1'/%3E%3Cpath d='M4 20C8 15 12 11 18 6' stroke='%235C7457' stroke-width='1'/%3E%3C/svg%3E">

<!-- PWA: позволяет добавить сайт на главный экран телефона как приложение. -->
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon-180.png">
<meta name="theme-color" content="#4B2E3D">

<!-- Open Graph / Twitter Card: даёт превью со вкладками картинки и текста,
     когда ссылку вставляют в мессенджеры (WhatsApp, Telegram) или соцсети.
     Значения title/description обновляются на лету скриптом (см. setMeta в main.js)
     для страниц создания открытки и просмотра готовой открытки. -->
<meta property="og:type" content="website">
<meta property="og:site_name" content="VivoRose">
<meta property="og:title" content="VivoRose — a card with a virtual bouquet">
<meta property="og:description" content="A virtual bouquet that never wilts — pick the flowers, write your message, and share it with one link.">
<meta property="og:url" content="">
<meta property="og:image" content="https://vivorose.com/og-image.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:type" content="image/png">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="VivoRose — a card with a virtual bouquet">
<meta name="twitter:description" content="A virtual bouquet that never wilts — pick the flowers, write your message, and share it with one link.">
<meta name="twitter:image" content="https://vivorose.com/og-image.png">

<link rel="stylesheet" href="/style/main.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>

<div id="app"><div class="boot-loading"><svg class="boot-loading-icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 13.6C4 13.2 2.3 9.4 3.4 5C5 5.4 6.8 6.6 8 9C8 5.8 9.7 3.8 12.7 2.4C14.5 6.6 13 12.2 8.4 13.5C8.3 13.55 8.15 13.58 8 13.6Z" fill="none" stroke="#8CA087" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 13C8 9.6 8.4 6.8 12 3" fill="none" stroke="#8CA087" stroke-width="1" stroke-linecap="round" opacity=".55"/></svg>Loading…</div></div>

<!-- Оба рекламных блока Adsterra визуально стоят в конструкторе, под
     карточкой превью открытки (в пустом месте справа от кнопок — колонка
     превью короче колонки формы). Живут они здесь, вне #app: renderCreator()
     перерисовывает #app через innerHTML на каждый "структурный" клик
     (повод/ваза/конверт/фон/модалка цветов), и если бы iframe были прямо в
     той разметке, каждый такой клик пересоздавал бы их — постоянная
     перезагрузка баннера и невалидный трафик в глазах рекламной сети.
     Вместо этого main.js физически переставляет (appendChild) эти же
     DOM-узлы в плейсхолдер #colPreviewAdSlot после каждого рендера и
     забирает обратно сюда перед следующим — iframe ни разу не
     пересоздаётся, значит и не перезагружается (см. parkInlineAd/
     mountInlineAd в main.js).
     Путь /x/*.html и классы promo-* намеренно без слова "ad": блокировщики
     режут такие URL/классы по общему правилу ещё до всякого CSP (проверено:
     /ads/native.html блокировался как net::ERR_BLOCKED_BY_CLIENT). У страниц
     в /x/ своя, отдельная (более мягкая) CSP (см. server/index.js).
     allow-same-origin обязателен: invoke.js читает document.cookie при
     старте (антифрод/частота показов) и без этого флага падает с
     SecurityError, так и не дойдя до показа объявления — проверено на
     практике. Это значит скрипт технически может дотянуться до DOM/кук
     родительской страницы (сам сайт при этом не трогаем: JWT-кука всё
     равно httpOnly). allow-popups(-to-escape-sandbox) — чтобы клик по
     объявлению открывал страницу рекламодателя в новой вкладке; без
     allow-top-navigation — чтобы никто не мог редиректнуть саму открытку. -->
<div id="adPool" style="display:none;">
  <div class="promo-row" id="inlineAdRow">
    <div class="promo-box" id="inlineAdNative" aria-label="Реклама">
      <div class="promo-tag">Реклама</div>
      <iframe src="/x/n1.html" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" loading="lazy" title="Реклама" style="display:block; border:0; width:300px; max-width:100%; height:250px;"></iframe>
    </div>
    <div class="promo-box" id="inlineAdBanner" aria-label="Реклама">
      <div class="promo-tag">Реклама</div>
      <iframe src="/x/n2.html" sandbox="allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox" loading="lazy" scrolling="no" title="Реклама" style="display:block; border:0; width:300px; height:250px;"></iframe>
    </div>
  </div>
</div>

<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script src="/script/main.js"></script>
</body>
</html>
